<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#ffffff">
    <title>哈基棠帅不帅？</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background-color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            padding: 20px;
        }
        
        .question {
            font-size: 24px;
            color: #000000;
            text-align: center;
            margin-bottom: 40px;
            line-height: 1.6;
            transition: all 0.3s ease;
        }
        
        .buttons-container {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }
        
        .btn {
            padding: 16px 40px;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            min-width: 100px;
        }
        
        .btn-no {
            background-color: #e74c3c;
            color: #ffffff;
        }
        
        .btn-yes {
            background-color: #27ae60;
            color: #ffffff;
        }
        
        .btn-yes.large {
            padding: 24px 60px;
            font-size: 28px;
        }
        
        .btn-yes.larger {
            padding: 32px 80px;
            font-size: 36px;
        }
        
        .btn-no.small {
            padding: 10px 25px;
            font-size: 12px;
        }
        
        .btn-no.hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="question" id="question">哈基棠帅不帅？</div>
    <div class="buttons-container" id="buttons">
        <button class="btn btn-no" id="btnNo">不帅</button>
        <button class="btn btn-yes" id="btnYes">帅</button>
    </div>

    <script>
        let step = 0;
        
        const question = document.getElementById('question');
        const btnNo = document.getElementById('btnNo');
        const btnYes = document.getElementById('btnYes');
        
        btnYes.addEventListener('click', function() {
            if (step === 0 || step === 1) {
                question.textContent = '我也这么觉得';
            } else if (step === 2) {
                question.textContent = '你乘了';
            }
        });
        
        btnNo.addEventListener('click', function() {
            if (step === 0) {
                question.textContent = '你确定吗？';
                btnYes.classList.add('large');
                btnNo.classList.add('small');
                step = 1;
            } else if (step === 1) {
                question.textContent = '你不乘哦~';
                btnYes.classList.remove('large');
                btnYes.classList.add('larger');
                btnNo.classList.add('hidden');
                step = 2;
            }
        });
    </script>
</body>
</html>
